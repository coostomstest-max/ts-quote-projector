<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyector de Cotización</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 700;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-light);
        }

        input[type="date"] {
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--bg);
        }

        input[type="date"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .indicators {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .indicator {
            text-align: center;
            padding: 1rem;
            border-radius: 12px;
            background: var(--bg);
            transition: transform 0.3s ease;
        }

        .indicator:hover {
            transform: translateY(-2px);
        }

        .indicator-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .indicator-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .indicator-value.current {
            color: var(--primary);
        }

        .indicator-value.projected {
            color: var(--success);
        }

        .indicator-value.positive {
            color: var(--danger);
        }

        .indicator-value.negative {
            color: var(--success);
        }

        .indicator-value.neutral {
            color: var(--text-light);
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 300px;
            color: var(--text-light);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-color.historical {
            background: var(--primary);
        }

        .legend-color.projected {
            background: var(--success);
            border: 2px dashed var(--success);
            background: transparent;
        }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .indicator-value {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 Proyector de Cotización</h1>
        
        <div class="card">
            <div class="controls">
                <div class="control-group">
                    <label for="datePicker">Seleccionar fecha futura</label>
                    <input type="date" id="datePicker">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="indicators" id="indicators">
                <div class="indicator">
                    <div class="indicator-label">Valor Actual (Compra)</div>
                    <div class="indicator-value current" id="currentValue">--</div>
                </div>
                <div class="indicator">
                    <div class="indicator-label">Valor Proyectado (Compra)</div>
                    <div class="indicator-value projected" id="projectedValue">--</div>
                </div>
                <div class="indicator">
                    <div class="indicator-label">Diferencia</div>
                    <div class="indicator-value neutral" id="difference">--</div>
                </div>
                <div class="indicator">
                    <div class="indicator-label">Días hasta fecha</div>
                    <div class="indicator-value neutral" id="daysUntil">--</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="chart-container" id="chartContainer">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>
                <canvas id="chart" style="display: none;"></canvas>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color historical"></div>
                    <span>Datos históricos</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color projected"></div>
                    <span>Proyección</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://apis.datos.gob.ar/series/api/series/?ids=168.1_T_CAMBIOR_D_0_0_26&limit=320';

        class ExchangeProjectorService {
            async obtenerCotizacionesUltimoAno() {
                const monthFrom = new Date();
                monthFrom.setFullYear(monthFrom.getFullYear() - 1);
                const startDate = monthFrom.toISOString().substring(0, 10);
                const url = `${API_URL}&start_date=${startDate.substring(0, 7)}`;

                const resp = await fetch(url);
                const data = await resp.json();

                const cotizaciones = data?.data?.map(d => {
                    const compra = Array.isArray(d) ? d[1] : d?.valor;
                    return {
                        fecha: Array.isArray(d) ? d[0] : d.fecha,
                        compra,
                        venta: compra * 1.025
                    };
                }) || [];

                return cotizaciones;
            }

            calcularTasaDiariaPromedio(cotizaciones) {
                if (cotizaciones.length < 2) {
                    throw new Error("No hay suficientes datos para estimar la tasa");
                }

                let sumaLogsCompra = 0;
                let sumaLogsVenta = 0;
                let conteo = 0;

                for (let i = 1; i < cotizaciones.length; i++) {
                    const anterior = cotizaciones[i - 1];
                    const actual = cotizaciones[i];

                    if (!actual || !anterior) continue;
                    const dias = (new Date(actual.fecha).getTime() - new Date(anterior.fecha).getTime()) / (1000 * 60 * 60 * 24);
                    if (dias <= 0) continue;

                    const factorCompra = actual.compra / anterior.compra;
                    const factorVenta = actual.venta / anterior.venta;

                    sumaLogsCompra += Math.log(factorCompra) / dias;
                    sumaLogsVenta += Math.log(factorVenta) / dias;
                    conteo++;
                }

                const tasaCompra = Math.exp(sumaLogsCompra / conteo) - 1;
                const tasaVenta = Math.exp(sumaLogsVenta / conteo) - 1;

                return { tasaCompra, tasaVenta };
            }

            calcularProyeccion(cotizaciones, fechaFutura) {
                const { tasaCompra, tasaVenta } = this.calcularTasaDiariaPromedio(cotizaciones);

                const hoy = new Date();
                const futuro = new Date(fechaFutura);
                const diffDias = (futuro.getTime() - hoy.getTime()) / (1000 * 60 * 60 * 24);

                if (diffDias < 0) {
                    throw new Error("La fecha futura debe ser posterior al día de hoy");
                }

                const ultima = cotizaciones[cotizaciones.length - 1];
                if (!ultima) {
                    throw new Error("No se pudo obtener la última cotización");
                }

                const proyCompra = ultima.compra * Math.pow(1 + tasaCompra, diffDias);
                const proyVenta = ultima.venta * Math.pow(1 + tasaVenta, diffDias);

                return {
                    proyCompra,
                    proyVenta,
                    diffDias,
                    ultima
                };
            }
        }

        class Chart {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.padding = { top: 20, right: 20, bottom: 40, left: 60 };
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                const container = this.canvas.parentElement;
                const rect = container.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = rect.width * dpr;
                this.canvas.height = rect.height * dpr;
                this.canvas.style.width = rect.width + 'px';
                this.canvas.style.height = rect.height + 'px';
                this.ctx.scale(dpr, dpr);
                this.width = rect.width;
                this.height = rect.height;
            }

            draw(historicalData, projectedData, projectedDate) {
                const { ctx, width, height, padding } = this;
                
                ctx.clearRect(0, 0, width, height);

                if (historicalData.length === 0) return;

                const allDates = [...historicalData.map(d => new Date(d.fecha)), new Date(projectedDate)];
                const allValues = [...historicalData.map(d => d.compra), projectedData.proyCompra];
                
                const minDate = Math.min(...allDates.map(d => d.getTime()));
                const maxDate = Math.max(...allDates.map(d => d.getTime()));
                const minValue = Math.min(...allValues) * 0.98;
                const maxValue = Math.max(...allValues) * 1.02;

                const chartWidth = width - padding.left - padding.right;
                const chartHeight = height - padding.top - padding.bottom;

                const xScale = (date) => padding.left + ((date.getTime() - minDate) / (maxDate - minDate)) * chartWidth;
                const yScale = (value) => padding.top + chartHeight - ((value - minValue) / (maxValue - minValue)) * chartHeight;

                // Grid lines
                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 5; i++) {
                    const y = padding.top + (chartHeight / 5) * i;
                    ctx.beginPath();
                    ctx.moveTo(padding.left, y);
                    ctx.lineTo(width - padding.right, y);
                    ctx.stroke();

                    const value = maxValue - ((maxValue - minValue) / 5) * i;
                    ctx.fillStyle = '#64748b';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'right';
                    ctx.fillText(value.toFixed(0), padding.left - 8, y + 4);
                }

                // Y-axis label
                ctx.save();
                ctx.translate(15, height / 2);
                ctx.rotate(-Math.PI / 2);
                ctx.fillStyle = '#64748b';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ARS', 0, 0);
                ctx.restore();

                // Historical line
                ctx.beginPath();
                ctx.strokeStyle = '#4f46e5';
                ctx.lineWidth = 2.5;
                historicalData.forEach((d, i) => {
                    const x = xScale(new Date(d.fecha));
                    const y = yScale(d.compra);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();

                // Historical points
                historicalData.forEach((d, i) => {
                    if (i % 10 !== 0 && i !== historicalData.length - 1) return;
                    const x = xScale(new Date(d.fecha));
                    const y = yScale(d.compra);
                    ctx.beginPath();
                    ctx.fillStyle = '#4f46e5';
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Projection line (dashed)
                ctx.beginPath();
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([8, 4]);
                
                const lastHistorical = historicalData[historicalData.length - 1];
                const projStartX = xScale(new Date(lastHistorical.fecha));
                const projStartY = yScale(lastHistorical.compra);
                const projEndX = xScale(new Date(projectedDate));
                const projEndY = yScale(projectedData.proyCompra);
                
                ctx.moveTo(projStartX, projStartY);
                ctx.lineTo(projEndX, projEndY);
                ctx.stroke();
                ctx.setLineDash([]);

                // Projected point
                ctx.beginPath();
                ctx.fillStyle = '#10b981';
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.arc(projEndX, projEndY, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // X-axis labels
                ctx.fillStyle = '#64748b';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                
                const labelCount = Math.min(5, historicalData.length);
                const step = Math.floor(historicalData.length / labelCount);
                for (let i = 0; i < historicalData.length; i += step) {
                    const d = historicalData[i];
                    const x = xScale(new Date(d.fecha));
                    const date = new Date(d.fecha);
                    ctx.fillText(date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }), x, height - 10);
                }

                // Last historical date
                const lastX = xScale(new Date(lastHistorical.fecha));
                ctx.fillText(new Date(lastHistorical.fecha).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }), lastX, height - 10);

                // Projected date
                ctx.fillStyle = '#10b981';
                ctx.fillText(new Date(projectedDate).toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }), projEndX, height - 10);
            }
        }

        class App {
            constructor() {
                this.service = new ExchangeProjectorService();
                this.cotizaciones = [];
                this.datePicker = document.getElementById('datePicker');
                this.chartCanvas = document.getElementById('chart');
                this.loading = document.getElementById('loading');
                this.chart = new Chart(this.chartCanvas);

                this.setupDatePicker();
                this.loadData();
            }

            setupDatePicker() {
                const today = new Date();
                const maxDate = new Date();
                maxDate.setMonth(maxDate.getMonth() + 6);

                this.datePicker.min = today.toISOString().split('T')[0];
                this.datePicker.max = maxDate.toISOString().split('T')[0];
                this.datePicker.value = today.toISOString().split('T')[0];

                this.datePicker.addEventListener('change', () => this.update());
            }

            async loadData() {
                try {
                    this.cotizaciones = await this.service.obtenerCotizacionesUltimoAno();
                    this.update();
                } catch (error) {
                    this.showError('Error al cargar datos: ' + error.message);
                }
            }

            update() {
                const selectedDate = this.datePicker.value;
                if (!selectedDate || this.cotizaciones.length === 0) return;

                try {
                    const projection = this.service.calcularProyeccion(this.cotizaciones, selectedDate);
                    this.updateIndicators(projection);
                    this.drawChart(projection, selectedDate);
                } catch (error) {
                    this.showError(error.message);
                }
            }

            updateIndicators(projection) {
                const currentEl = document.getElementById('currentValue');
                const projectedEl = document.getElementById('projectedValue');
                const differenceEl = document.getElementById('difference');
                const daysEl = document.getElementById('daysUntil');

                const current = projection.ultima.compra;
                const projected = projection.proyCompra;
                const diff = projected - current;
                const diffPercent = (diff / current) * 100;

                currentEl.textContent = '$' + current.toFixed(2);
                projectedEl.textContent = '$' + projected.toFixed(2);
                differenceEl.textContent = (diff >= 0 ? '+' : '') + diffPercent.toFixed(2) + '%';
                
                differenceEl.className = 'indicator-value ' + (diff >= 0 ? 'positive' : 'negative');
                
                daysEl.textContent = Math.round(projection.diffDias) + ' días';
            }

            drawChart(projection, selectedDate) {
                this.loading.style.display = 'none';
                this.chartCanvas.style.display = 'block';
                this.chart.draw(this.cotizaciones, projection, selectedDate);
            }

            showError(message) {
                this.loading.innerHTML = `<div class="error">${message}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new App();
        });
    </script>
</body>
</html>
