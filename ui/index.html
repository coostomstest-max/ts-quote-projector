<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyector de Cotización</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1 class="header__title">📈 Proyector de Cotización</h1>
            <p class="header__subtitle">Visualiza proyecciones basadas en datos históricos del BCRA</p>
        </header>

        <section class="card">
            <div class="controls">
                <div class="control-group">
                    <label for="datePicker" class="control-group__label">Seleccionar fecha</label>
                    <input type="date" id="datePicker" class="input">
                </div>
                <div class="control-group">
                    <label for="strategySelect" class="control-group__label">Estrategia de proyección</label>
                    <select id="strategySelect" class="input">
                        <option value="ses">SES (Suavizado Exponencial Simple)</option>
                        <option value="crecimiento_compuesto">Crecimiento Compuesto Logarítmico</option>
                        <option value="spline_monotono">Spline Cúbico Monotónico</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="card">
            <div class="grid grid--indicators">
                <div class="indicator">
                    <div class="indicator__label">Valor Actual</div>
                    <div id="currentValue" class="indicator__value indicator__value--current">--</div>
                </div>
                <div class="indicator">
                    <div class="indicator__label">Valor Proyectado</div>
                    <div id="projectedValue" class="indicator__value indicator__value--projected">--</div>
                </div>
                <div class="indicator">
                    <div class="indicator__label">Diferencia</div>
                    <div id="difference" class="indicator__value indicator__value--neutral">--</div>
                </div>
                <div class="indicator">
                    <div class="indicator__label">Días</div>
                    <div id="daysUntil" class="indicator__value indicator__value--neutral">--</div>
                </div>
            </div>
        </section>

        <section class="card">
            <!-- Zoom Controls -->
            <div class="chart-toolbar">
                <div class="zoom-buttons">
                    <button class="zoom-btn active" data-range="1m">1M</button>
                    <button class="zoom-btn" data-range="3m">3M</button>
                    <button class="zoom-btn" data-range="6m">6M</button>
                    <button class="zoom-btn" data-range="1y">1Y</button>
                    <button class="zoom-btn" data-range="all">Todo</button>
                </div>
                <div class="zoom-controls">
                    <button class="zoom-btn" id="zoomInBtn" title="Acercar">➕</button>
                    <button class="zoom-btn" id="zoomOutBtn" title="Alejar">➖</button>
                </div>
            </div>

            <!-- Chart + Scrollbar -->
            <div class="chart-viewport">
                <div id="chartWrapper" class="chart-wrapper">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                    <canvas id="chart" class="chart" style="display: none;"></canvas>
                </div>
                <div class="chart-scrollbar">
                    <input type="range" id="timelineSlider" class="slider" min="0" max="1000" value="0" step="1">
                </div>
            </div>

            <div class="legend">
                <div class="legend__item">
                    <div class="legend__color legend__color--historical"></div>
                    <span>Datos históricos</span>
                </div>
                <div class="legend__item">
                    <div class="legend__color legend__color--projected"></div>
                    <span>Proyección</span>
                </div>
            </div>

            <!-- Tooltip -->
            <div id="chartTooltip" class="chart-tooltip" style="display: none;"></div>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
